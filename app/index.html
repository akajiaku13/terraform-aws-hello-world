<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World</title>
<style>body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f7fa;color:#172b4d}.card{background:#fff;padding:3rem;border-radius:16px;box-shadow:0 8px 30px #091e4226;text-align:center}h1{color:#146eb4}</style></head>
<body><main class="card"><h1>Hello World</h1><p>Deployed immutably with Terraform and GitHub Actions.</p><p>Simulating a rollback</p></p><p>Version: __VERSION__</p><p>Environment: <strong id="env">loading...</strong></p><p id="msg"></p></main>
<script>fetch("/config.json").then(r=>r.json()).then(c=>{document.getElementById("env").textContent=c.environment;document.getElementById("msg").textContent=c.message}).catch(()=>{document.getElementById("env").textContent="unknown"})</script></body>
</html>
